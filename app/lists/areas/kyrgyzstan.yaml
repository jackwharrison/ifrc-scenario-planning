# Country set-up for Kyrgyzstan.
# A file like this pre-fills the area list in the template for a country. Countries without one still work:
# the National Society lists its areas in tab Lists of the workbook, or the app uses the names typed in tab 3.
#
# pcode: optional. Fill in from the OCHA administrative boundaries for Kyrgyzstan on HDX
#        (Common Operational Dataset, admin level 1) if you want to join with other data later.
#        Left empty on purpose: copy the codes from the official dataset rather than typing them from memory.
# city:  optional. Adds "city" after the name in the area table.
country: Kyrgyzstan
area_column: Oblasts        # header of the area column in tab 3 of the workbook
area_label: oblast          # how one area is called in sentences
areas:
  - {name: Talas,      pcode: ""}
  - {name: Bishkek,    pcode: "", city: true}
  - {name: Chui,       pcode: ""}
  - {name: Issyk-Kul,  pcode: ""}
  - {name: Jalal-Abad, pcode: ""}
  - {name: Naryn,      pcode: ""}
  - {name: Batken,     pcode: ""}
  - {name: Osh,        pcode: ""}
example_workbook: kyrgyzstan_example.xlsx   # in /samples, offered on the upload page
