# Runs the tests on every push and pull request, and deploys to Azure App Service when main changes.
#
# Before the first run, add two settings in GitHub (Settings > Secrets and variables > Actions):
#   Variable  AZURE_WEBAPP_NAME             the name of your web app in Azure
#   Secret    AZURE_WEBAPP_PUBLISH_PROFILE  the publish profile downloaded from the web app in the Azure portal
# See the README, "Deploy to Azure", for details.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
